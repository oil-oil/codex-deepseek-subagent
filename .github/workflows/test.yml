name: test

on:
  push:
  pull_request:

jobs:
  manager:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run manager tests
        run: python scripts/test_manager.py
      - name: Compile manager
        run: python -m py_compile codex-deepseek-subagent/scripts/codex_deepseek.py
